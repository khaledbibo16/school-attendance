<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق إدارة الغياب والـ QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 480px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1d3557; text-align: center; margin-top: 0; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #333; }
        .nav-btn.active { background: #1d3557; color: white; }
        .section-view { display: none; }
        .section-view.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; }
        .btn-primary { background: #1d3557; }
        .btn-success { background: #2a9d8f; }
        .btn-danger { background: #e63946; }
        .btn-email { background: #e76f51; }
        .btn-copy { background: #264653; }
        .btn-reset { background: #6c757d; }
        .btn-print { background: #457b9d; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; background: #000; min-height: 220px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f1f1f1; }
        .num-text { font-family: Arial, sans-serif; direction: ltr; display: inline-block; }
        
        .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .qr-card { border: 2px dashed #1d3557; padding: 8px; border-radius: 6px; text-align: center; background: #fff; page-break-inside: avoid; }
        .alert-copy { background: #d4edda; color: #155724; padding: 8px; border-radius: 6px; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- أزرار التنقل بين الواجهتين -->
    <div class="nav-buttons no-print">
        <button class="nav-btn active" id="btn-admin" onclick="switchTab('admin')">⚙️ واجهة الإدارة</button>
        <button class="nav-btn" id="btn-teacher" onclick="switchTab('teacher')">👨‍🏫 واجهة الأستاذ</button>
    </div>

    <!---------------- واجهة الإدارة ---------------->
    <div id="view-admin" class="section-view active">
        <div class="no-print">
            <h2>⚙️ لوحة الإدارة</h2>
            <div class="form-group">
                <label>اسم المؤسسة التربوية:</label>
                <input type="text" id="school-name" placeholder="مثال: ثانوية النجاح">
            </div>

            <hr>

            <h3>➕ إضافة قسم وتلاميذه</h3>
            <div class="form-group">
                <label>اسم القسم:</label>
                <input type="text" id="class-name" placeholder="مثال: 1 ج م ع 1">
            </div>
            <div class="form-group">
                <label>قائمة التلاميذ (كل تلميذ في سطر: الرقم,الاسم):</label>
                <textarea id="students-input" rows="4" placeholder="1,زعميش رحمة&#10;2,بن خيرة رسيم"></textarea>
            </div>
            <button class="btn btn-success" onclick="addClass()">💾 حفظ القسم والتلاميذ</button>

            <hr>

            <h3>🖨️ توليد بطاقات QR</h3>
            <div class="form-group">
                <label>اختر القسم لعرض الـ QR:</label>
                <select id="admin-class-select" onchange="renderQRCards()"></select>
                <button class="btn btn-danger" onclick="deleteSelectedClass()" style="margin-top: 8px;">🗑️ حذف القسم المحدد</button>
            </div>
            
            <button class="btn btn-print" onclick="window.print()">🖨️ طباعة بطاقات الـ QR</button>
        </div>

        <div id="print-area">
            <h3 id="print-title" style="text-align: center; margin-top: 15px; font-size: 16px;"></h3>
            <div id="qr-container" class="qr-grid"></div>
        </div>
    </div>

    <!---------------- واجهة الأستاذ ---------------->
    <div id="view-teacher" class="section-view no-print">
        <h2>👨‍🏫 مسح الغياب</h2>
        <p id="school-title" style="text-align: center; color: #666; font-size: 13px; margin-top: -5px;"></p>

        <div class="form-group">
            <label>اختر القسم الحالي (ستبدأ الكاميرا تلقائياً):</label>
            <select id="teacher-class-select" onchange="changeClass()">
                <option value="">-- اختر القسم للبدء --</option>
            </select>
        </div>

        <div id="reader"></div>
        
        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button class="btn btn-primary" onclick="showFinalReport()" style="flex:2;">📋 التقرير النهائي</button>
            <button class="btn btn-reset" onclick="resetScan()" style="flex:1;">🔄 إعادة ضبط</button>
        </div>

        <div id="report-div" style="display: none; margin-top: 15px;">
            <h4 style="color: #2e7d32;">🟢 الحاضرون (<span id="p-count" class="num-text">0</span>):</h4>
            <table id="present-table"><tr><th>الرقم</th><th>الاسم</th><th>الوقت</th></tr></table>

            <h4 style="color: #c62828;">🔴 الغائبون (<span id="a-count" class="num-text">0</span>):</h4>
            <table id="absent-table"><tr><th>الرقم</th><th>الاسم</th></tr></table>

            <div style="margin-top: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px;">
                <button class="btn btn-copy" onclick="copyReportText()">📋 نسخ التقرير (واتساب)</button>
                <div id="copy-alert" class="alert-copy">✅ تم نسخ التقرير بنجاح!</div>

                <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">

                <label>أو إرسال بالبريد للمدير:</label>
                <input type="email" id="email-target" placeholder="admin@school.dz">
                <button class="btn btn-email" onclick="sendEmail()">📧 فتح البريد للإرسال</button>
            </div>
        </div>
    </div>
</div>

<script>
    let appData = JSON.parse(localStorage.getItem('appData')) || {
        schoolName: "المؤسسة التربوية",
        classes: []
    };

    let currentClass = null;
    let presentMap = new Map();
    let html5QrCode = null;

    document.getElementById('school-name').value = appData.schoolName;
    updateSelects();

    window.addEventListener('DOMContentLoaded', () => {
        if (window.location.hash === '#teacher') {
            switchTab('teacher');
        } else {
            switchTab('admin');
        }
    });

    function switchTab(tab) {
        document.getElementById('view-admin').classList.remove('active');
        document.getElementById('view-teacher').classList.remove('active');
        document.getElementById('btn-admin').classList.remove('active');
        document.getElementById('btn-teacher').classList.remove('active');

        if (tab === 'admin') {
            document.getElementById('view-admin').classList.add('active');
            document.getElementById('btn-admin').classList.add('active');
            stopScanner();
            history.replaceState(null, null, '#admin');
        } else {
            document.getElementById('view-teacher').classList.add('active');
            document.getElementById('btn-teacher').classList.add('active');
            document.getElementById('school-title').innerText = appData.schoolName;
            history.replaceState(null, null, '#teacher');
        }
    }

    document.getElementById('school-name').addEventListener('input', (e) => {
        appData.schoolName = e.target.value;
        localStorage.setItem('appData', JSON.stringify(appData));
    });

    function updateSelects() {
        let adminSelect = document.getElementById('admin-class-select');
        let teacherSelect = document.getElementById('teacher-class-select');
        
        adminSelect.innerHTML = '<option value="">-- اختر قسم --</option>';
        teacherSelect.innerHTML = '<option value="">-- اختر القسم للبدء --</option>';

        appData.classes.forEach(c => {
            adminSelect.innerHTML += `<option value="${c.className}">${c.className}</option>`;
            teacherSelect.innerHTML += `<option value="${c.className}">${c.className}</option>`;
        });
    }

    function addClass() {
        let cName = document.getElementById('class-name').value.trim();
        let rawStudents = document.getElementById('students-input').value.trim();

        if (!cName || !rawStudents) {
            alert("يرجى إدخال اسم القسم وقائمة التلاميذ!");
            return;
        }

        let studentsArr = rawStudents.split('\n').map(line => {
            let parts = line.split(',');
            return {
                num: parts[0] ? parts[0].trim() : "",
                name: parts[1] ? parts[1].trim() : parts[0].trim()
            };
        }).filter(s => s.num && s.name);

        let existingIndex = appData.classes.findIndex(c => c.className === cName);
        if (existingIndex > -1) {
            appData.classes[existingIndex].students = studentsArr;
        } else {
            appData.classes.push({ className: cName, students: studentsArr });
        }

        localStorage.setItem('appData', JSON.stringify(appData));
        updateSelects();
        document.getElementById('class-name').value = "";
        document.getElementById('students-input').value = "";
        alert("✅ تم حفظ القسم والتلاميذ بنجاح!");
        document.getElementById('admin-class-select').value = cName;
        renderQRCards();
    }

    function deleteSelectedClass() {
        let selected = document.getElementById('admin-class-select').value;
        if (!selected) return;
        if (confirm(`هل أنت متأكد من حذف قسم "${selected}"؟`)) {
            appData.classes = appData.classes.filter(c => c.className !== selected);
            localStorage.setItem('appData', JSON.stringify(appData));
            updateSelects();
            document.getElementById('qr-container').innerHTML = "";
            document.getElementById('print-title').innerText = "";
        }
    }

    function renderQRCards() {
        let selectedClass = document.getElementById('admin-class-select').value;
        let container = document.getElementById('qr-container');
        container.innerHTML = "";
        
        if (!selectedClass) return;

        let cls = appData.classes.find(c => c.className === selectedClass);
        if (!cls) return;

        document.getElementById('print-title').innerText = `${appData.schoolName} - بطاقات QR لقسم: ${cls.className}`;

        cls.students.forEach(s => {
            let card = document.createElement('div');
            card.className = 'qr-card';
            card.innerHTML = `
                <div style="font-size:10px; font-weight:bold; color:#555;">${appData.schoolName}</div>
                <div style="font-size:12px; font-weight:bold; color:#1d3557; margin:2px 0;">${s.name}</div>
                <div style="font-size:11px;">رقم: <b>${s.num}</b></div>
                <div id="qr-${s.num}" style="margin-top:5px; display:flex; justify-content:center;"></div>
            `;
            container.appendChild(card);

            new QRCode(document.getElementById(`qr-${s.num}`), {
                text: s.num,
                width: 90,
                height: 90
            });
        });
    }

    function changeClass() {
        let className = document.getElementById('teacher-class-select').value;
        
        if (!className) {
            stopScanner();
            currentClass = null;
            return;
        }

        currentClass = appData.classes.find(c => c.className === className);
        presentMap.clear();
        document.getElementById('report-div').style.display = 'none';

        startScanner();
    }

    function startScanner() {
        stopScanner();

        html5QrCode = new Html5Qrcode("reader");
        
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 15, qrbox: 200 },
            (decodedText) => {
                if (!currentClass) return;
                let clean = decodedText.trim();
                let found = currentClass.students.find(s => s.num === clean || decodedText.includes(s.name));
                
                if (found) {
                    if (!presentMap.has(found.num)) {
                        let time = new Date().toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit'});
                        presentMap.set(found.num, time);
                        alert(`✅ تم تسجيل حضور: ${found.name} (رقم ${found.num})`);
                    }
                } else {
                    alert(`⚠️ هذا الكود لا ينتمي إلى تلاميذ قسم ${currentClass.className}`);
                }
            },
            (errorMessage) => {}
        ).catch(err => {
            alert("❌ تعذر تشغيل الكاميرا. يرجى التأكد من إعطاء إذن استخدام الكاميرا للمتصفح: " + err);
        });
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
            }).catch(err => {
                console.log("إيقاف الكاميرا:", err);
            });
            html5QrCode = null;
        }
    }

    function showFinalReport() {
        if (!currentClass) {
            alert("يرجى اختيار القسم أولاً!");
            return;
        }

        let pTable = document.getElementById('present-table');
        let aTable = document.getElementById('absent-table');
        pTable.innerHTML = "<tr><th>الرقم</th><th>الاسم</th><th>الوقت</th></tr>";
        aTable.innerHTML = "<tr><th>الرقم</th><th>الاسم</th></tr>";

        let pCount = 0, aCount = 0;

        currentClass.students.forEach(s => {
            if (presentMap.has(s.num)) {
                pCount++;
                pTable.innerHTML += `<tr><td><span class="num-text">${s.num}</span></td><td><b>${s.name}</b></td><td><span class="num-text">${presentMap.get(s.num)}</span></td></tr>`;
            } else {
                aCount++;
                aTable.innerHTML += `<tr><td><span class="num-text">${s.num}</span></td><td><b>${s.name}</b></td></tr>`;
            }
        });

        document.getElementById('p-count').innerText = pCount;
        document.getElementById('a-count').innerText = aCount;
        document.getElementById('report-div').style.display = 'block';
    }

    function generateReportText() {
        let text = `🏫 تقرير الغياب والحضور\nالمؤسسة: ${appData.schoolName}\nالقسم: ${currentClass ? currentClass.className : 'غير محدد'}\nالتاريخ: ${new Date().toLocaleDateString('ar-DZ')}\n\n`;
        
        text += `🟢 الحاضرون (${presentMap.size}):\n`;
        if (presentMap.size === 0) {
            text += `- لم يتم تسجيل أي حضور\n`;
        } else {
            presentMap.forEach((time, num) => {
                let st = currentClass.students.find(s => s.num === num);
                text += `- ${st ? st.name : num} (الساعة: ${time})\n`;
            });
        }

        let totalStudents = currentClass ? currentClass.students.length : 0;
        let absentCount = totalStudents - presentMap.size;
        text += `\n🔴 الغائبون (${absentCount}):\n`;
        if (currentClass) {
            currentClass.students.forEach(s => {
                if (!presentMap.has(s.num)) {
                    text += `- ${s.name} (رقم ${s.num})\n`;
                }
            });
        }
        return text;
    }

    // 🛠️ تم تصحيح وظيفة النسخ إلى الحافظة هنا (writeText بدلاً من writeTest)
    function copyReportText() {
        let reportText = generateReportText();
        navigator.clipboard.writeText(reportText).then(() => {
            let alertBox = document.getElementById('copy-alert');
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
        }).catch(() => {
            alert("تعذر النسخ التلقائي.");
        });
    }

    function sendEmail() {
        let email = document.getElementById('email-target').value;
        if (!email) { alert("أدخل البريد الإلكتروني أولاً"); return; }
        let body = generateReportText();
        window.location.href = `mailto:${email}?subject=${encodeURIComponent("تقرير غياب - " + (currentClass ? currentClass.className : ""))} &body=${encodeURIComponent(body)}`;
    }

    function resetScan() {
        if (confirm("هل تريد مسح سجل الحضور الحالي وبدء جلسة جديدة؟")) {
            presentMap.clear();
            document.getElementById('report-div').style.display = 'none';
        }
    }
</script>
</body>
</html>
