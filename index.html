            cursor: pointer;
            color: white;
        }
        .btn-generate { background: #2d6a4f; }
        .btn-print { background: #1d3557; }

        textarea {

        label { font-weight: bold; font-size: 13px; color: #444; display: block; }

        #cards-container { margin-top: 15px; }

        .print-card {

            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .card-info {

            font-size: 12px;
            text-align: right;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .qr-box { flex-shrink: 0; width: 80px; height: 80px; }
        .qr-box canvas { display: block; width: 80px; height: 80px; }

                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
