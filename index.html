<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة البطاقات - نظام الحضور</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d3557">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 15px;
            text-align: center;
            color: #333;
        }

        .main-container { max-width: 500px; margin: auto; }

        .app-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,.1);
            text-align: right;
        }

        h2 { color: #1d3557; text-align: center; margin-top: 0; }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-generate { background: #2d6a4f; }
        .btn-print { background: #1d3557; }
        .btn-secondary { background: #6c757d; }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }
        textarea {
            height: 180px;
            resize: vertical;
            line-height: 1.6;
        }
        label { font-weight: bold; font-size: 13px; color: #444; display: block; }

        #cards-container { margin-top: 15px; }

        .print-card {
            border: 2px dashed #2d6a4f;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .card-info {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            text-align: right;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .qr-box { flex-shrink: 0; width: 80px; height: 80px; }
        .qr-box img { display: block; width: 80px; height: 80px; }

        @page { size: A4 portrait; margin: 8mm; }

        @media print {
            @page { size: A4 portrait; margin: 7mm; }
            html, body { display: block !important; width: 100% !important; height: auto !important; margin: 0 !important; padding: 0 !important; background: white !important; overflow: visible !important; }
            body.printing-cards .main-container { max-width: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            body.printing-cards .no-print,
            body.printing-cards #setup-section { display: none !important; }
            body.printing-cards #cards-section { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            body.printing-cards #cards-container {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                grid-auto-rows: 1fr;
                gap: 3mm !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            body.printing-cards .print-card {
                display: flex !important;
                flex-direction: row !important;
                align-items: center !important;
                justify-content: space-between !important;
                gap: 3mm !important;
                width: 100% !important;
                height: 62mm !important;
                margin: 0 !important;
                padding: 3mm !important;
                background: white !important;
                border: 1.5px dashed #2d6a4f !important;
                border-radius: 2mm !important;
                box-sizing: border-box !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            body.printing-cards .card-info { flex: 1 !important; min-width: 0 !important; font-size: 11pt !important; line-height: 1.7 !important; }
            body.printing-cards .qr-box { flex: 0 0 30mm !important; width: 30mm !important; height: 30mm !important; }
            body.printing-cards .qr-box img { display: block !important; width: 30mm !important; height: 30mm !important; }
        }
    </style>
</head>

<body>

<div class="main-container">

    <div id="admin-section" class="app-section">
        <h2>⚙️ واجهة إدارة البطاقات</h2>

        <div id="setup-section">
            <label for="school-input">اسم المؤسسة التربوية:</label>
            <input type="text" id="school-input" value="المدرسة الابتدائية سعايدية عبد القادر">

            <label for="class-input">اسم القسم:</label>
            <input type="text" id="class-input" value="السنة الأولى ابتدائي (1أ)">

            <label for="names-input">✏️ اكتب أو الصق قائمة أسماء التلاميذ (اسم في كل سطر):</label>
            <textarea id="names-input" placeholder="محمد بلقاسم&#10;فاطمة الزهراء عيسى&#10;أحمد بن علي"></textarea>

            <button class="btn btn-generate" onclick="generateCards()">🖨️ توليد واعتماد بطاقات QR</button>
        </div>

        <div id="cards-section" style="display:none;">
            <div class="no-print">
                <button class="btn btn-print" onclick="window.print()">🖨️ طباعة البطاقات (A4)</button>
                <button class="btn btn-secondary" onclick="location.reload()">⬅️ التعديل على القائمة</button>
            </div>
            <div id="cards-container"></div>
        </div>

        <div class="no-print" style="text-align: center; margin-top: 20px;">
            <a href="teacher.html" style="display:inline-block; padding: 10px 15px; background: #2a9d8f; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 13px;">📱 الانتقال إلى واجهة الأستاذ (مسح الغياب)</a>
        </div>
    </div>

</div>

<script>
    function generateCards() {
        const school = document.getElementById("school-input").value.trim();
        const cls = document.getElementById("class-input").value.trim();
        const rawText = document.getElementById("names-input").value.trim();

        if (!rawText) {
            alert("يرجى كتابة أو لصق أسماء التلاميذ أولاً.");
            return;
        }

        const lines = rawText.split("\n")
            .map(line => line.trim())
            .filter(line => line.length > 0);

        if (lines.length === 0) {
            alert("لم يتم العثور على أي أسماء صالحة.");
            return;
        }

        let studentsList = lines.map((name, index) => ({
            num: String(index + 1),
            name: name
        }));

        localStorage.setItem("schoolName", school);
        localStorage.setItem("className", cls);
        localStorage.setItem("studentsList", JSON.stringify(studentsList));

        const container = document.getElementById("cards-container");
        container.innerHTML = "";

        studentsList.forEach((student) => {
            const card = document.createElement("div");
            card.className = "print-card";

            const info = document.createElement("div");
            info.className, cardInfoClass = "card-info";
            info.className = "card-info";

            info.innerHTML = `
                <b>${school}</b>
                <div>القسم: ${cls}</div>
                <div>رقم التلميذ: ${student.num}</div>
                <div>اسم التلميذ: <b>${student.name}</b></div>
            `;

            const qrBox = document.createElement("div");
            qrBox.className = "qr-box";
            
            const img = document.createElement("img");
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(student.num)}`;
            img.alt = "QR";

            qrBox.appendChild(img);
            card.append(info, qrBox);
            container.appendChild(card);
        });

        document.getElementById("setup-section").style.display = "none";
        document.getElementById("cards-section").style.display = "block";
    }
</script>

</body>
</html>
