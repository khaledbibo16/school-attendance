<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأستاذ - ماسح الغياب</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; text-align: center; color: #333; }
        .box { background: white; max-width: 420px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: right; }
        h2 { color: #2a9d8f; text-align: center; margin-top: 0; }
        .btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; }
        .btn-report { background: #1d3557; }
        .btn-email { background: #e76f51; }
        .btn-copy { background: #264653; }
        .btn-reset { background: #6c757d; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f1f1f1; }
        .num-text { font-family: Arial, sans-serif; direction: ltr; display: inline-block; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        label { font-weight: bold; font-size: 13px; color: #444; display: block; }
        .alert-copy { background: #d4edda; color: #155724; padding: 8px; border-radius: 6px; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>👨‍🏫 مسح الغياب والتقرير النهائي</h2>
        <p id="class-title" style="text-align: center; color: #666; font-size: 13px; margin-top: -5px;"></p>

        <div id="reader"></div>
        
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-report" onclick="showFinalReport()" style="flex:2;">📋 إظهار التقرير النهائي</button>
            <button class="btn btn-reset" onclick="resetScan()" style="flex:1;">🔄 إعادة ضبط</button>
        </div>

        <div id="report-div" style="display: none; margin-top: 15px;">
            <h4 style="color: #2e7d32;">🟢 الحاضرون (<span id="p-count" class="num-text">0</span>):</h4>
            <table id="present-table"><tr><th>الرقم</th><th>الاسم</th><th>الوقت</th></tr></table>

            <h4 style="color: #c62828;">🔴 الغائبون (<span id="a-count" class="num-text">0</span>):</h4>
            <table id="absent-table"><tr><th>الرقم</th><th>الاسم</th></tr></table>

            <div style="margin-top: 20px; background: #f8f9fa; padding: 10px; border-radius: 8px;">
                <!-- زر نسخ التقرير المضمون 100% -->
                <button class="btn btn-copy" onclick="copyReportText()">📋 نسخ التقرير إلى الحافظة (واتساب / رسائل)</button>
                <div id="copy-alert" class="alert-copy">✅ تم نسخ التقرير بنجاح! يمكنك لصقه في أي مكان الآن.</div>

                <hr style="border: 0; border-top: 1px solid #ddd; margin: 12px 0;">

                <label>أو إرسال عبر البريد الإلكتروني للمدير:</label>
                <input type="email" id="email-target" placeholder="admin@school.dz">
                <button class="btn btn-email" onclick="sendEmail()">📧 فتح تطبيق البريد للإرسال</button>
            </div>
        </div>
    </div>

    <script>
        let schoolName = localStorage.getItem('schoolName') || "المؤسسة التربوية";
        let className = localStorage.getItem('className') || "القسم العام";
        let studentsList = JSON.parse(localStorage.getItem('studentsList')) || [
            {num: "1", name: "زعميش رحمة"}, {num: "2", name: "بن خيرة رسيم"}, {num: "3", name: "عدة محمد"}
        ];

        document.getElementById('class-title').innerText = `${schoolName} - ${className}`;

        let presentMap = new Map();
        let scanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 200 });

        scanner.render((text) => {
            let clean = text.trim();
            let found = studentsList.find(s => s.num === clean || text.includes(s.name));
            if (found && !presentMap.has(found.num)) {
                let time = new Date().toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit'});
                presentMap.set(found.num, time);
                alert(`✅ تم تسجيل حضور: ${found.name} (رقم ${found.num})`);
            }
        });

        function showFinalReport() {
            let pTable = document.getElementById('present-table');
            let aTable = document.getElementById('absent-table');
            pTable.innerHTML = "<tr><th>الرقم</th><th>الاسم</th><th>الوقت</th></tr>";
            aTable.innerHTML = "<tr><th>الرقم</th><th>الاسم</th></tr>";

            let pCount = 0, aCount = 0;

            studentsList.forEach(s => {
                if (presentMap.has(s.num)) {
                    pCount++;
                    pTable.innerHTML += `<tr><td><span class="num-text">${s.num}</span></td><td><b>${s.name}</b></td><td><span class="num-text">${presentMap.get(s.num)}</span></td></tr>`;
                } else {
                    aCount++;
                    aTable.innerHTML += `<tr><td><span class="num-text">${s.num}</span></td><td><b>${s.name}</b></td></tr>`;
                }
            });

            document.getElementById('p-count').innerText = pCount;
            document.getElementById('a-count').innerText = aCount;
            document.getElementById('report-div').style.display = 'block';
        }

        function generateReportText() {
            let text = `🏫 تقرير الغياب والحضور\nالمؤسسة: ${schoolName}\nالقسم: ${className}\nالتاريخ: ${new Date().toLocaleDateString('en-US')}\n\n`;
            
            text += `🟢 الحاضرون (${presentMap.size}):\n`;
            if (presentMap.size === 0) {
                text += `- لم يتم تسجيل أي حضور\n`;
            } else {
                presentMap.forEach((time, num) => {
                    let st = studentsList.find(s => s.num === num);
                    text += `- ${st ? st.name : num} (الساعة: ${time})\n`;
                });
            }

            let absentCount = studentsList.length - presentMap.size;
            text += `\n🔴 الغائبون (${absentCount}):\n`;
            studentsList.forEach(s => {
                if (!presentMap.has(s.num)) {
                    text += `- ${s.name} (رقم ${s.num})\n`;
                }
            });
            return text;
        }

        function copyReportText() {
            let reportText = generateReportText();
            navigator.clipboard.writeText(reportText).then(() => {
                let alertBox = document.getElementById('copy-alert');
                alertBox.style.display = 'block';
                setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
            }).catch(err => {
                alert("تعذر النسخ التلقائي، يرجى تحديد النص يدوياً.");
            });
        }

        function sendEmail() {
            let email = document.getElementById('email-target').value;
            if (!email) { alert("أدخل البريد الإلكتروني أولاً"); return; }
            let body = generateReportText();
            window.location.href = `mailto:${email}?subject=${encodeURIComponent("تقرير غياب - " + className)}&body=${encodeURIComponent(body)}`;
        }

        function resetScan() {
            if (confirm("هل تريد مسح سجل الحضور الحالي وبدء حصة جديدة؟")) {
                presentMap.clear();
                document.getElementById('report-div').style.display = 'none';
            }
        }
    </script> 
      <div style="text-align: center; margin: 25px 0; padding: 15px; background: #fff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <a href="admin.html" style="color: #1d3557; font-weight: bold; text-decoration: none; font-size: 16px;">
            ⚙️ الانتقال إلى واجهة الإدارة لإنشاء البطاقات
        </a>
    </div>
</body>
</html>


</body>
